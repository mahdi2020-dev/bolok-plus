# Security + caching for bolokapp.ir (Liara static)
# Note: nginx does not inherit add_header into locations that define their own —
# repeat the security set in every block that sets Cache-Control.

location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2|ico)$ {
  expires 7d;
  add_header Cache-Control "public, max-age=604800, immutable";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}

location = /robots.txt {
  add_header Cache-Control "public, max-age=86400";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  try_files $uri =404;
}

location = /sitemap.xml {
  default_type application/xml;
  add_header Cache-Control "public, max-age=3600";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  try_files $uri =404;
}

location = /.well-known/security.txt {
  default_type text/plain;
  add_header Cache-Control "public, max-age=86400";
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri =404;
}

location / {
  index index.html;
  try_files $uri $uri/ =404;
  add_header Cache-Control "public, max-age=300, must-revalidate";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-XSS-Protection "0" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https://trustseal.enamad.ir https://*.enamad.ir; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://backendpy.liara.run; upgrade-insecure-requests" always;
}

error_page 404 /404.html;
location = /404.html {
  internal;
  add_header Cache-Control "no-store";
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
}
