<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none" role="img" aria-label="ماسکات جزوه‌سرا">
  <!-- soft ground shadow -->
  <ellipse cx="100" cy="208" rx="52" ry="8" fill="#000" opacity="0.12"/>

  <!-- legs -->
  <path d="M78 168c-2 14 0 28 2 34" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <path d="M122 168c2 14 0 28-2 34" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="78" cy="202" rx="14" ry="7" fill="#111"/>
  <ellipse cx="122" cy="202" rx="14" ry="7" fill="#111"/>

  <!-- body (green) -->
  <path d="M62 118c0-18 16-34 38-34h0c22 0 38 16 38 34v36c0 18-16 30-38 30s-38-12-38-30v-36z" fill="#B6F36A" stroke="#111" stroke-width="5"/>
  <!-- belly highlight -->
  <ellipse cx="100" cy="150" rx="18" ry="14" fill="#fff" opacity="0.28"/>

  <!-- arms -->
  <path d="M64 132c-18 6-28 22-22 34" stroke="#FF90E8" stroke-width="11" stroke-linecap="round"/>
  <path d="M136 132c18 6 28 22 22 34" stroke="#FF90E8" stroke-width="11" stroke-linecap="round"/>
  <circle cx="40" cy="166" r="11" fill="#FF90E8" stroke="#111" stroke-width="4"/>
  <circle cx="160" cy="166" r="11" fill="#FF90E8" stroke="#111" stroke-width="4"/>

  <!-- pamphlet in left hand -->
  <g transform="translate(22 142) rotate(-12)">
    <rect x="0" y="0" width="28" height="36" rx="3" fill="#FFF7E8" stroke="#111" stroke-width="3.5"/>
    <path d="M6 10h16M6 16h14M6 22h12" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="0" y="0" width="5" height="36" rx="1.5" fill="#FF90E8" stroke="#111" stroke-width="2"/>
  </g>

  <!-- neck -->
  <rect x="90" y="88" width="20" height="18" rx="6" fill="#FF90E8" stroke="#111" stroke-width="4"/>

  <!-- head -->
  <circle cx="100" cy="62" r="44" fill="#FF90E8" stroke="#111" stroke-width="5"/>
  <!-- cheek blush -->
  <ellipse cx="72" cy="72" rx="8" ry="5" fill="#FF5EC8" opacity="0.45"/>
  <ellipse cx="128" cy="72" rx="8" ry="5" fill="#FF5EC8" opacity="0.45"/>
  <!-- eyes -->
  <circle cx="84" cy="58" r="6.5" fill="#111"/>
  <circle cx="116" cy="58" r="6.5" fill="#111"/>
  <circle cx="86" cy="56" r="2.2" fill="#fff"/>
  <circle cx="118" cy="56" r="2.2" fill="#fff"/>
  <!-- brows -->
  <path d="M74 46c6-5 14-5 20 0" stroke="#111" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M106 46c6-5 14-5 20 0" stroke="#111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M86 74c6 10 22 10 28 0" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <!-- hair tuft -->
  <path d="M78 28c8-18 28-22 40-10 2 10-4 16-12 14-8 10-22 10-28-4z" fill="#FF5EC8" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
</svg>
